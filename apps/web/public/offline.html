<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>quki · 离线</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f4f1ea;
        color: #1c1916;
        font: 16px/1.5 "Source Han Sans SC", "Noto Sans SC", sans-serif;
        padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom));
      }
      @media (prefers-color-scheme: dark) {
        body { background: #161513; color: #f3efe8; }
      }
      main { max-width: 28rem; }
      h1 { font-size: 1.4rem; font-weight: 600; margin: 0 0 8px; }
      p { margin: 0 0 16px; }
      button {
        height: 40px;
        padding: 0 16px;
        border: 1px solid currentColor;
        background: transparent;
        color: inherit;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>当前没有网络</h1>
      <p>账户持仓和行情不会在离线时用旧数据顶替。连上网络后再打开。</p>
      <button type="button" onclick="location.reload()">重试</button>
    </main>
  </body>
</html>
